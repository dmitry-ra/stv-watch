[project]
name = "stv-watch"
version = "0.2.3"
description = "SourceTV relay viewer for Half-Life 2: Deathmatch: voice with a transcript, game chat and events, live or from a recording"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitry Razumikhin" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnx-asr==0.12.0",
    "onnxruntime>=1.30",
    "opuslib-next-bundled==0.1.1",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: First Person Shooters",
]

[project.scripts]
stv-watch = "stvwatch.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stvwatch"]

[dependency-groups]
dev = [
    "black==26.10.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -m 'not model'"
markers = ["model: needs the recognition weights (Parakeet 2.55 GB, Nemotron 0.68 GB); run with -m model"]
